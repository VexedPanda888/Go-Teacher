[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "katago-mcp"
version = "0.1.4"
description = "MCP server exposing KataGo as a Go-teaching analysis engine"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2,<2",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
katago-mcp = "katago_mcp.cli:main"
katago-mcp-seed = "katago_mcp.seed:main"

[tool.setuptools.packages.find]
include = ["katago_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
