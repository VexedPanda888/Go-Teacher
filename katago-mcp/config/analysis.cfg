# KataGo analysis-engine config for katago-mcp (all machines share this file; thread counts are
# overridden per machine by the numSearchThreads value the install script writes at the bottom).
#
# Conventions the server depends on:
#   reportAnalysisWinratesAs = BLACK   -> winrate/scoreLead/ownership are Black-perspective
#   analysisPVLen >= 12                -> long enough PVs for the 12-ply verification ladder
# If you change reportAnalysisWinratesAs, change [katago].perspective in the TOML too and run
# `katago-mcp selfcheck`.

logDir = analysis_logs
logAllRequests = false
logAllResponses = false
logSearchInfo = false
logToStderr = false

# Rules and komi are given per query by the server (the analysis engine ignores a `rules` key here).

reportAnalysisWinratesAs = BLACK
analysisPVLen = 15

# One analysis thread keeps queries strictly ordered by priority; the survey and interactive queries
# share the GPU through the search threads below.
numAnalysisThreads = 1
maxVisits = 100000000
maxPlayouts = 100000000

nnCacheSizePowerOfTwo = 21
nnMutexPoolSizePowerOfTwo = 17
nnMaxBatchSize = 32

# Human model: humanPolicy is emitted when -human-model is loaded; the profile is overridden per query
# via overrideSettings.humanSLProfile.  Weights of 0 keep the human model out of the main search.
humanSLProfile = rank_7k
humanSLRootExploreProbWeightless = 0
humanSLRootExploreProbWeightful = 0
humanSLPlaExploreProbWeightless = 0
humanSLPlaExploreProbWeightful = 0
humanSLOppExploreProbWeightless = 0
humanSLOppExploreProbWeightful = 0

# --- per-machine (install scripts append the right value) ---
numSearchThreadsPerAnalysisThread = 24
