[machine]
name = "m2air"

[katago]
binary = "/opt/homebrew/bin/katago"
analysis_config = "config/analysis.cfg"
model = "models/kata1-b18c384nbt-latest.bin.gz"
human_model = "models/b18c384nbt-humanv0.bin.gz"
search_threads = 8                           # numSearchThreadsPerAnalysisThread, passed with -override-config
perspective = "BLACK"                         # must match reportAnalysisWinratesAs in analysis.cfg
startup_timeout = 180
query_timeout = 1800                         # fanless: sustained throughput drops as it warms

[throughput]
# filled by `katago-mcp benchmark --config config/m2air.toml` (written to m2air.throughput.json)
visits_per_second_cold = 0
visits_per_second_sustained = 0
measured_at = ""

[student]
username = "cwhay888"
rank = "7k"
target_offset_stones = 3
horizon_rank = "rank_1d"

[budget]
overhead_minutes = 4
claude_minutes_per_episode = 1.0
self_review_minutes_default = 5     # blind self-review
interview_minutes_default = 5       # per-episode interviews
survey_minutes_target = 10          # survey sized to finish in about this long
survey_floor = 100
survey_cap = 1000
ld_reserve_episodes = 1
max_episodes = 5
min_episodes = 3
unit_base = { root = 1000, line_node = 250, plies = 6, stability = [4], solve = 1500 }
unit_cap  = { root = 6000, line_node = 1000, plies = 8, stability = [4, 16], solve = 4000 }
ladder = ["root_3000", "line_600", "stability_16x", "plies_8", "solve_4000_all_ld", "root_6000", "line_1000"]

[thresholds]
acceptable_margin = 1.0
episode_min_loss = 2.0
alive = 0.6
dead = -0.6
reconciliation_tolerance = 2.5
# candidate-tag rules, calibrated in WS8 (notes in seed/calibration.md, kept locally, not in git)
tag_plausible_min_loss = 2.0
tag_plausible_min_peer = 0.20
tag_plausible_ratio = 1.5
tag_intuition_best_min = 0.20
tag_intuition_played_max = 0.10
tag_punish_min_loss = 5.0
tag_direction_min_distance = 5

[paths]
reviews_dir = "reviews"

[logging]
level = "info"
