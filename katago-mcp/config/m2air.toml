[machine]
name = "m2air"

[katago]
binary = "/opt/homebrew/bin/katago"
analysis_config = "config/analysis.cfg"
model = "models/kata1-b18c384nbt-latest.bin.gz"
human_model = "models/b18c384nbt-humanv0.bin.gz"
search_threads = 8                           # numSearchThreadsPerAnalysisThread, passed with -override-config
perspective = "BLACK"                         # must match reportAnalysisWinratesAs in analysis.cfg
startup_timeout = 180
query_timeout = 1800                         # fanless: sustained throughput drops as it warms

[throughput]
# filled by `katago-mcp benchmark --config config/m2air.toml` (written to m2air.throughput.json)
visits_per_second_cold = 0
visits_per_second_sustained = 0
measured_at = ""

[student]
username = "cwhay888"
rank = "7k"
target_offset_stones = 3
horizon_rank = "rank_1d"

[search]
# Fixed search sizes for this machine: a review takes as long as it needs (engine_info reports how long
# explain_moment takes here). Slower machine: smaller sizes, never fewer checks.
survey_minutes_target = 10          # the survey is sized from the measured visits/s to take about this long
survey_floor = 100
survey_cap = 1000
root = 1000                         # a position's own search
line_node = 250                     # each search inside a line or a probe
plies = 6                           # forced lines, imagined lines, PV continuations
stability = 4                       # the stability re-run searches at root x this
local_solve = 1500                  # each move of a life-and-death playout
quick = 200

[thresholds]
acceptable_margin = 1.0
episode_min_loss = 2.0              # a move losing at least this is a swing the story names
alive = 0.6
dead = -0.6
reconciliation_tolerance = 2.5
positive_min_choice = 0.5
group_event_min_size = 4            # the story tells the fate of groups this big
group_event_hold = 6                # ... when the new status still holds this many moves later

[prefetch]
moments = 3                         # when a survey finishes, prepare explain_moment for this many key moments (0: off)
priority = 5                        # KataGo priority of that work: survey 0 < prefetch < Claude's calls 10

[seed]
# Seeding: a brief review of past games, one at a time (go-teacher-flow, references/seeding.md).
games = 10                          # recent games taken when the student names none
min_moves = 60                      # shorter games are left out
survey_visits = 250                 # per move; a stored survey with at least this many is reused
prepare_moments = 1                 # explain_moment prepared in the background for each game's top key moment
ready_ahead = 3                     # games kept loaded and prepared ahead of the student (0: all)
ogs_pages = 6                       # pages of 50 OGS games read at most to find them

[paths]
reviews_dir = "reviews"

[logging]
level = "info"
