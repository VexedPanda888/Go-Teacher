<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Go review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --paper: #ECEDEA;
  --panel: #FFFFFF;
  --panel-2: #F5F5F2;
  --ink: #1B1F24;
  --muted: #646B76;
  --rule: #D6D8D3;
  --wood: #D9B26B;
  --wood-edge: #B8924A;
  --grid: #6B4F1D;
  --accent: #2A6F77;
  --accent-soft: rgba(42, 111, 119, 0.14);
  --loss: #B23A2E;
  --gain: #3E7D4A;
  --stone-b: #1A1A1A;
  --stone-w: #F4F2EC;
  --focus: #2A6F77;
  --best: #1F5FD1;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Literata", Georgia, "Iowan Old Style", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14171C; --panel: #1C2027; --panel-2: #22272F; --ink: #E6E8EB; --muted: #9AA3AF; --rule: #2F353E;
    --wood: #C9A45C; --wood-edge: #9E7C3A; --grid: #4E3A15; --accent: #5FB0B7; --accent-soft: rgba(95,176,183,0.18);
    --loss: #E06B5C; --gain: #6FBF7A; --stone-w: #E9E6DE; --focus: #5FB0B7; --best: #5B9BFF;
  }
}
:root[data-theme="dark"] {
  --paper: #14171C; --panel: #1C2027; --panel-2: #22272F; --ink: #E6E8EB; --muted: #9AA3AF; --rule: #2F353E;
  --wood: #C9A45C; --wood-edge: #9E7C3A; --grid: #4E3A15; --accent: #5FB0B7; --accent-soft: rgba(95,176,183,0.18);
  --loss: #E06B5C; --gain: #6FBF7A; --stone-w: #E9E6DE; --focus: #5FB0B7; --best: #5B9BFF;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; min-height: 100%; background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: var(--accent); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px clamp(12px, 2.5vw, 28px) 40px; }

/* header */
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding: 4px 0 14px; }
.head h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(20px, 2.4vw, 26px); margin: 0; letter-spacing: -0.01em; }
.head .facts { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.head .facts span + span::before { content: ""; }
.head .spacer { flex: 1; }
.iconbtn { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; color: var(--muted); }
.iconbtn:hover { color: var(--ink); }

/* main grid */
.main { display: grid; grid-template-columns: minmax(0, 7fr) minmax(300px, 5fr); gap: 20px; align-items: start; }
@media (max-width: 880px) { .main { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; }

/* board column */
.boardwrap { position: relative; }
.goban { display: block; width: 100%; height: auto; border-radius: 6px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.goban .pt { cursor: pointer; }
.readout { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; padding: 12px 4px 6px; }
.readout .movenum { font-size: 22px; font-weight: 500; }
.readout .movenum small { color: var(--muted); font-size: 14px; font-weight: 400; }
.readout .score { font-size: 15px; }
.readout .score b { font-weight: 600; }
.readout .who { color: var(--muted); }
.readout .best { flex-basis: 100%; font-size: 14px; }
.readout .best b { color: var(--best); font-weight: 600; }
.controls { display: flex; align-items: center; gap: 8px; padding: 4px 0 2px; flex-wrap: wrap; }
.controls .nav { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--panel); }
.controls .nav button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; min-width: 40px; }
.controls .nav button + button { border-left: 1px solid var(--rule); }
.controls .nav button:hover { background: var(--panel-2); }
.controls .nav button:disabled { color: var(--muted); cursor: default; background: transparent; }
.controls .toggles { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.chip { border: 1px solid var(--rule); background: var(--panel); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip:disabled { color: var(--muted); cursor: default; }
.slider { width: 100%; margin: 10px 0 0; accent-color: var(--accent); }
.strip { position: relative; height: 22px; margin: 2px 0 0; }
.strip .ep { position: absolute; top: 4px; height: 14px; border-radius: 3px; background: var(--accent-soft); border: 1px solid var(--accent); cursor: pointer; font-size: 11px; line-height: 12px; color: var(--ink); padding: 0 4px; overflow: hidden; white-space: nowrap; }
.strip .ep.active { background: var(--accent); color: #fff; }
.strip.has-q { height: 40px; }
.strip .ep.q { top: 22px; border-style: dashed; background: var(--panel); }   /* questions on their own row */
.strip .ep.q.active { background: var(--accent); }
.strip .marker { position: absolute; top: 0; width: 2px; height: 22px; background: var(--loss); }
.strip .marker.lc { background: var(--gain); }
.varbar { display: none; align-items: center; gap: 10px; margin-top: 10px; padding: 8px 12px; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent-soft); font-size: 14px; }
.varbar.on { display: flex; flex-wrap: wrap; }
.varbar .label { font-weight: 500; }
.varbar .eval { margin-left: auto; }
.varbar button { border: 1px solid var(--accent); background: var(--panel); border-radius: 6px; padding: 4px 10px; cursor: pointer; }

/* right column */
.graph { padding: 12px 12px 6px; }
.graph h2, .lesson h2, .summary h2 { margin: 0 0 6px; font-size: 14px; font-weight: 500; color: var(--muted); }
.graph svg { width: 100%; height: auto; display: block; cursor: crosshair; }
.graph .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); padding: 4px 2px 0; flex-wrap: wrap; }
.lesson { margin-top: 14px; padding: 14px 16px 16px; }
.eplist { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; padding: 0; list-style: none; }
.eplist button { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 6px 10px; cursor: pointer; text-align: left; font-size: 13px; line-height: 1.3; max-width: 100%; overflow-wrap: anywhere; }
.eplist button .r { color: var(--muted); display: block; font-size: 12px; }
.eplist button.active { border-color: var(--accent); background: var(--accent-soft); }
.eplist.q button { border-style: dashed; }
.lesson h2.qhead { margin-top: 2px; }
.lesson h3 { font-family: var(--serif); font-weight: 600; font-size: 20px; margin: 4px 0 2px; letter-spacing: -0.005em; }
.lesson .meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.lesson .meta .lost { color: var(--loss); }
.commentary { font-family: var(--serif); font-size: 16.5px; line-height: 1.55; min-height: 3.2em; }
.commentary p { margin: 0 0 8px; }
.commentary .at { color: var(--muted); font-family: var(--sans); font-size: 12.5px; }
.commentary .empty { color: var(--muted); font-style: italic; }
.branches { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
.branches button { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 7px 11px; cursor: pointer; font-size: 13.5px; }
.branches button.active { border-color: var(--accent); background: var(--accent-soft); }
.branches button small { color: var(--muted); display: block; font-size: 12px; }
.principle { margin: 14px 0 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--panel-2); border-radius: 0 6px 6px 0; font-family: var(--serif); font-size: 15.5px; }
.principle .cue { font-family: var(--sans); font-size: 13px; color: var(--muted); margin-top: 4px; }
.quiz { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); }
.quiz .q { font-weight: 500; margin-bottom: 8px; }
.quiz .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.quiz .opts button { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 6px 11px; cursor: pointer; }
.quiz .opts button.picked { border-color: var(--accent); background: var(--accent-soft); }
.quiz .result { margin-top: 10px; font-size: 14px; }
.quiz table { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 6px; }
.quiz td, .quiz th { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--rule); font-weight: 400; }
.quiz th { color: var(--muted); font-size: 12.5px; }
.quiz td.num { text-align: right; padding-right: 0; }
.compare { margin-top: 14px; }
.compare h4 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.compare table { border-collapse: collapse; width: 100%; font-size: 14px; }
.compare td, .compare th { text-align: left; vertical-align: top; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--rule); font-weight: 400; }
.compare th { color: var(--muted); font-size: 12.5px; }
.compare td:first-child { color: var(--muted); font-size: 13px; width: 32%; }
.principle .check { font-family: var(--sans); font-size: 14px; font-weight: 500; margin-bottom: 4px; }
.quiz .tag { display: inline-block; font-size: 11.5px; color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; margin-left: 4px; }
.quiz .tag.you { color: var(--accent); border-color: var(--accent); }

.sidecol, .boardcol { min-width: 0; }
/* summary */
.summary { margin-top: 20px; padding: 16px 18px 18px; }
.summary .headline { font-family: var(--serif); font-size: 18px; line-height: 1.45; margin: 0 0 12px; }
.summary .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 24px; }
.summary h4 { margin: 0 0 6px; font-size: 13.5px; font-weight: 500; color: var(--muted); }
.summary ul { margin: 0; padding-left: 18px; }
.summary li { margin-bottom: 5px; }
.summary .fine { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
/* live review: boards Claude sends during the review, answers clicked on the board */
.live { margin-top: 14px; padding: 14px 16px 16px; }
.live h2 { margin: 0 0 6px; font-size: 14px; font-weight: 500; color: var(--muted); }
.live .status { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
.live .status.warn { color: var(--loss); }
.eplist button.new { border-color: var(--accent); }
.eplist button.bad { border-style: dashed; color: var(--loss); }
.answer { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); }
.answer .how { font-size: 14px; margin-bottom: 8px; }
.answer .moves { font-family: var(--sans); font-size: 14px; margin: 6px 0 8px; min-height: 1.4em; }
.answer .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.answer button { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.answer button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
.answer button:disabled { opacity: 0.5; cursor: default; }
.answer .msg { font-size: 13.5px; margin-top: 8px; }
.answer .msg.warn { color: var(--loss); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.scrollx { overflow-x: auto; }
@media (prefers-reduced-motion: no-preference) {
  .goban .last { transition: cx 120ms ease, cy 120ms ease; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1 id="title">Go review</h1>
    <div class="facts" id="facts"></div>
    <span class="spacer"></span>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Switch color theme">Theme</button>
  </header>

  <div class="main">
    <section class="boardcol" aria-label="Board and replay">
      <div class="boardwrap">
        <svg id="goban" class="goban" viewBox="0 0 800 800" role="img" aria-labelledby="gobanLabel"><title id="gobanLabel">Go board</title></svg>
      </div>
      <div class="readout">
        <div class="movenum"><span id="moveNum">0</span> <small id="moveTotal">/ 0</small></div>
        <div class="score" id="scoreBox">You: <b id="scoreNow">0.0</b> <span class="who" id="scoreWho"></span></div>
        <div class="who" id="lastMove"></div>
        <div class="best" id="bestInfo" hidden></div>
      </div>
      <div class="controls">
        <div class="nav" role="group" aria-label="Replay">
          <button type="button" id="btnFirst" title="First move (Home)">|&#8249;</button>
          <button type="button" id="btnPrev" title="Previous move (left arrow)">&#8249;</button>
          <button type="button" id="btnNext" title="Next move (right arrow)">&#8250;</button>
          <button type="button" id="btnLast" title="Last move (End)">&#8250;|</button>
        </div>
        <div class="toggles">
          <button type="button" class="chip" id="tglBest" aria-pressed="true" title="The engine's best move for the move just played, in blue">Best move</button>
          <button type="button" class="chip" id="tglOwn" aria-pressed="false">Territory estimate</button>
          <button type="button" class="chip" id="tglNums" aria-pressed="false">Number this episode</button>
        </div>
      </div>
      <input type="range" class="slider" id="slider" min="0" max="0" value="0" aria-label="Move number">
      <div class="strip" id="strip" aria-label="Key moments"></div>
      <div class="varbar" id="varbar">
        <span class="label" id="varLabel"></span>
        <span id="varPly"></span>
        <span class="eval" id="varEval"></span>
        <button type="button" id="varExit">Back to the game</button>
      </div>
    </section>

    <aside class="sidecol">
      <div class="panel graph" id="graphPanel">
        <h2>Score, your perspective</h2>
        <svg id="graph" viewBox="0 0 600 200" aria-label="Score graph"></svg>
        <div class="legend" id="graphLegend"></div>
      </div>
      <div class="panel lesson" id="lesson">
        <h2>Key moments</h2>
        <ul class="eplist" id="eplist"></ul>
        <h2 class="qhead" id="qhead" hidden>Your questions</h2>
        <ul class="eplist q" id="qlist" hidden></ul>
        <div id="epbody"></div>
      </div>
      <div class="panel live" id="live" hidden>
        <h2 id="liveHead">Review in progress</h2>
        <p class="status" id="liveStatus"></p>
        <ul class="eplist" id="boardlist"></ul>
        <div id="boardbody"></div>
      </div>
    </aside>
  </div>

  <section class="panel summary" id="summary"></section>
</div>
<script id="data" type="application/json">{"__placeholder__": true}</script>
<script id="core">
// ---- pure replay logic (no DOM); also loaded by the node tests -------------------------------
const Core = (() => {
  const N = 19, COLS = "ABCDEFGHJKLMNOPQRST";
  const EMPTY = 0, B = 1, W = 2;
  function parseMove(m) {
    const color = m[0] === "B" ? B : W;
    const pt = m.slice(1);
    if (pt.toLowerCase() === "pass") return { color, idx: null };
    const c = COLS.indexOf(pt[0].toUpperCase());
    const y = parseInt(pt.slice(1), 10);
    if (c < 0 || !(y >= 1 && y <= N)) throw new Error("bad move " + m);
    return { color, idx: (N - y) * N + c };
  }
  function pointIdx(pt) { return parseMove("B" + pt).idx; }
  function gtp(idx) { if (idx === null || idx === undefined) return "pass"; const r = Math.floor(idx / N), c = idx % N; return COLS[c] + (N - r); }
  function neighbors(idx) {
    const r = Math.floor(idx / N), c = idx % N, out = [];
    if (r > 0) out.push(idx - N); if (r < N - 1) out.push(idx + N); if (c > 0) out.push(idx - 1); if (c < N - 1) out.push(idx + 1);
    return out;
  }
  function group(cells, idx) {
    const color = cells[idx], stones = [idx], seen = new Set([idx]); let libs = 0;
    for (let i = 0; i < stones.length; i++) {
      for (const n of neighbors(stones[i])) {
        if (cells[n] === EMPTY) libs++;
        else if (cells[n] === color && !seen.has(n)) { seen.add(n); stones.push(n); }
      }
    }
    return { stones, libs };
  }
  // play without legality checks (moves are engine-validated upstream); returns new cells + captured points
  function play(cells, color, idx) {
    const next = new Int8Array(cells);
    if (idx === null) return { cells: next, captured: [] };
    next[idx] = color;
    const opp = color === B ? W : B, captured = [];
    for (const n of neighbors(idx)) {
      if (next[n] === opp) {
        const g = group(next, n);
        if (g.libs === 0) for (const s of g.stones) { next[s] = EMPTY; captured.push(s); }
      }
    }
    const own = group(next, idx);
    if (own.libs === 0) for (const s of own.stones) { next[s] = EMPTY; captured.push(s); }   // suicide (never expected)
    return { cells: next, captured };
  }
  function replay(setup, moves) {
    let cells = new Int8Array(N * N);
    for (const p of (setup.AB || [])) cells[pointIdx(p)] = B;
    for (const p of (setup.AW || [])) cells[pointIdx(p)] = W;
    const positions = [cells], caps = [{ B: 0, W: 0 }], parsed = [];
    for (const m of moves) {
      const mv = parseMove(m); parsed.push(mv);
      const r = play(cells, mv.color, mv.idx); cells = r.cells;
      const prev = caps[caps.length - 1];
      caps.push({ B: prev.B + (mv.color === B ? r.captured.length : 0), W: prev.W + (mv.color === W ? r.captured.length : 0) });
      positions.push(cells);
    }
    return { positions, caps, parsed };
  }
  function playLine(cells, moves) {
    const out = [cells], parsed = [];
    for (const m of moves) { const mv = parseMove(m); parsed.push(mv); cells = play(cells, mv.color, mv.idx).cells; out.push(cells); }
    return { positions: out, parsed };
  }
  function decodeOwnership(s) { const out = new Float32Array(s.length); for (let i = 0; i < s.length; i++) out[i] = (s.charCodeAt(i) - 97) / 10 - 1; return out; }
  function starPoints() { const out = []; for (const r of [3, 9, 15]) for (const c of [3, 9, 15]) out.push(r * N + c); return out; }
  function fmtScore(v) { if (v === null || v === undefined || Number.isNaN(v)) return "–"; const a = Math.abs(v).toFixed(1); return v > 0.05 ? "+" + a : v < -0.05 ? "−" + a : "0.0"; }
  // a move the student clicks: refuse an occupied point, suicide, and retaking a ko at once
  function legalPlay(cells, color, idx, beforePrev) {
    if (idx === null) return { ok: true, cells: new Int8Array(cells) };
    if (cells[idx] !== EMPTY) return { ok: false, reason: "that point is occupied" };
    const r = play(cells, color, idx);
    if (r.cells[idx] !== color) return { ok: false, reason: "that move would be suicide" };
    if (beforePrev && r.cells.every((v, i) => v === beforePrev[i])) return { ok: false, reason: "that retakes the ko at once" };
    return { ok: true, cells: r.cells };
  }
  // canonical JSON exactly as katago-mcp's export.canonical (sorted keys, no spaces); rows carry its SHA-256
  function canonical(v) {
    if (Array.isArray(v)) return "[" + v.map(canonical).join(",") + "]";
    if (v && typeof v === "object") return "{" + Object.keys(v).sort().map((k) => JSON.stringify(k) + ":" + canonical(v[k])).join(",") + "}";
    return JSON.stringify(v === undefined ? null : v);
  }
  const UNSIGNED = ["title", "text", "sha256"];   // free text; everything else in a row is checked
  async function rowIntact(row) {
    if (!row || typeof row.sha256 !== "string") return false;
    const body = {}; for (const k of Object.keys(row)) if (!UNSIGNED.includes(k)) body[k] = row[k];
    const subtle = (globalThis.crypto || {}).subtle; if (!subtle) return false;
    const buf = await subtle.digest("SHA-256", new TextEncoder().encode(canonical(body)));
    const hex = Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    return hex === row.sha256;
  }
  // the dashboard's data shape from a live-page game row (no engine data: no scores, no ownership)
  function fromGameRow(g) {
    const you = g.you === "W" ? "W" : "B", opp = you === "B" ? "W" : "B", pl = g.players || {};
    return { live: true, game: { id: g.game_id, you, opponent: (pl[opp] || {}).name || "opponent", opponentRank: (pl[opp] || {}).rank || null,
             yourRank: (pl[you] || {}).rank || null, date: g.date, handicap: g.handicap, komi: g.komi, rules: g.rules, result: g.result, players: pl },
             setup: g.setup || { AB: [], AW: [] }, moves: g.moves || [], scoreSeries: null, episodes: [], ownership: {}, summary: null };
  }
  return { N, COLS, EMPTY, B, W, parseMove, pointIdx, gtp, neighbors, group, play, replay, playLine, decodeOwnership, starPoints, fmtScore,
           legalPlay, canonical, rowIntact, fromGameRow };
})();
if (typeof module !== "undefined") module.exports = Core;
</script>
<script>
// ---- the page: App(D) draws a review; D is the embedded blob (final review) or, on the live page,
// the game row from the db (Core.fromGameRow). Boards and answers come from the db in both cases.
function App(D) {
  const { N, B, W, EMPTY } = Core;
  const LIVE = !!D.live;
  const you = D.game.you === "W" ? W : B, youName = you === B ? "Black" : "White";

  const episodes = D.episodes || [];
  const isQuestion = (e) => e.kind === "question";   // follow-up questions: same shape as a key moment, shown apart
  const lessonEps = episodes.filter((e) => !isQuestion(e));   // the key moments
  const $ = (id) => document.getElementById(id);
  const state = { move: 0, mode: "game", ep: lessonEps[0] || episodes[0] || null, br: null, vpos: null, vply: 0, quiz: null, showOwn: false, showNums: false, showBest: true,
                  bd: null, bpos: null, bply: 0 };
  // live boards (db): rows by id, answers by board id, the student's unsent clicks by board id
  const live = { db: null, canAnswer: false, boards: new Map(), bad: new Set(), answers: new Map(), drafts: new Map(), seen: 0, sending: null, msg: {} };

  // ---------- header ----------
  const opp = D.game.opponent || "opponent";
  const oppRank = D.game.opponentRank ? " (" + D.game.opponentRank + ")" : "";
  $("title").textContent = "You (" + youName + ") vs " + opp + oppRank;

  const facts = [];

  $("facts").innerHTML = facts.map((f) => "<span>" + esc(f) + "</span>").join("");
  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  // ---------- goban ----------
  const svg = $("goban"), NS = "http://www.w3.org/2000/svg";
  const CELL = 40, OFF = 40, R = 18.6;
  const xy = (idx) => [OFF + (idx % N) * CELL, OFF + Math.floor(idx / N) * CELL];
  function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; }
  function drawStatic() {
    el("rect", { x: 4, y: 4, width: 792, height: 792, rx: 6, fill: "var(--wood)", stroke: "var(--wood-edge)", "stroke-width": 2 });
    for (let i = 0; i < N; i++) {

      el("line", { x1: OFF + i * CELL, y1: OFF, x2: OFF + i * CELL, y2: OFF + (N - 1) * CELL, stroke: "var(--grid)", "stroke-width": i === 0 || i === N - 1 ? 1.6 : 1 });
      const t1 = el("text", { x: OFF + i * CELL, y: 18, "text-anchor": "middle", "font-size": 13, fill: "var(--grid)", "font-family": "var(--sans)" }); t1.textContent = Core.COLS[i];
      const t2 = el("text", { x: OFF + i * CELL, y: 792, "text-anchor": "middle", "font-size": 13, fill: "var(--grid)", "font-family": "var(--sans)" }); t2.textContent = Core.COLS[i];
      const t3 = el("text", { x: 16, y: OFF + i * CELL + 4.5, "text-anchor": "middle", "font-size": 13, fill: "var(--grid)", "font-family": "var(--sans)" }); t3.textContent = N - i;
      const t4 = el("text", { x: 784, y: OFF + i * CELL + 4.5, "text-anchor": "middle", "font-size": 13, fill: "var(--grid)", "font-family": "var(--sans)" }); t4.textContent = N - i;
    }
    for (const s of Core.starPoints()) { const [x, y] = xy(s); el("circle", { cx: x, cy: y, r: 3.6, fill: "var(--grid)" }); }
  }
  drawStatic();
  const gOwn = el("g", { id: "own" }), gStones = el("g", { id: "stones" }), gMarks = el("g", { id: "marks" }), gLabels = el("g", { id: "labels" }), gHit = el("g", { id: "hit" });
  for (let i = 0; i < N * N; i++) { const [x, y] = xy(i); const h = el("rect", { x: x - CELL / 2, y: y - CELL / 2, width: CELL, height: CELL, fill: "transparent", class: "pt" }, gHit); h.dataset.idx = i; }
  gHit.addEventListener("click", (ev) => { const t = ev.target; if (t && t.dataset && t.dataset.idx !== undefined) onBoardClick(parseInt(t.dataset.idx, 10)); });

  function clear(g) { while (g.firstChild) g.removeChild(g.firstChild); }
  function currentCells() {
    if (state.mode === "variation") return state.vpos.positions[state.vply];
    if (state.mode === "board") return state.bpos.positions[state.bply];
    return game.positions[state.move];
  }
  function currentLastIdx() {
    if (state.mode === "variation") return state.vply > 0 ? state.vpos.parsed[state.vply - 1].idx : null;
    if (state.mode === "board") return state.bply > 0 ? state.bpos.parsed[state.bply - 1].idx : null;
    if (state.mode === "quiz") return null;
    return state.move > 0 ? game.parsed[state.move - 1].idx : null;
  }
  function drawStones() {
    clear(gStones); clear(gMarks); clear(gLabels); clear(gOwn);
    const cells = currentCells();
    for (let i = 0; i < N * N; i++) {
      if (cells[i] === EMPTY) continue;
      const [x, y] = xy(i);
      if (cells[i] === B) el("circle", { cx: x, cy: y, r: R, fill: "var(--stone-b)" }, gStones);
      else el("circle", { cx: x, cy: y, r: R - 0.6, fill: "var(--stone-w)", stroke: "#8B8578", "stroke-width": 1 }, gStones);
    }
    const last = currentLastIdx();
    const labelled = state.mode === "variation" || state.mode === "board" || (state.mode === "game" && state.showNums && state.ep && state.move >= state.ep.moves[0] && state.move <= state.ep.moves[1]);
    if (last !== null && last !== undefined && !labelled) {
      const [x, y] = xy(last);
      el("circle", { cx: x, cy: y, r: 7, fill: "none", stroke: cells[last] === B ? "#E9E6DE" : "#1A1A1A", "stroke-width": 2.2, class: "last" }, gMarks);
    }
    // the best move for the move just played: a blue ring on the stone when it was played, else a blue disc on its point
    const bm = bestForMove();
    if (bm && bm.idx !== null) {
      const [x, y] = xy(bm.idx);
      if (bm.matched) el("circle", { cx: x, cy: y, r: R + 1, fill: "none", stroke: "var(--best)", "stroke-width": 3 }, gMarks);
      else el("circle", { cx: x, cy: y, r: 13, fill: "var(--best)", stroke: "#fff", "stroke-width": 1.5, opacity: 0.9 }, gMarks);
    }
    // ownership overlay
    const key = ownershipKey();
    if (state.showOwn && key) {
      const own = Core.decodeOwnership(D.ownership[key]);
      for (let i = 0; i < N * N; i++) {
        const v = own[i]; if (Math.abs(v) < 0.15) continue;
        const [x, y] = xy(i); const size = cells[i] === EMPTY ? 26 : 14;
        el("rect", { x: x - size / 2, y: y - size / 2, width: size, height: size, rx: 2, fill: v > 0 ? "#111" : "#fff", opacity: Math.min(0.85, Math.abs(v)) * 0.8 }, gOwn);
      }
    }
    // labels: numbers for the episode or the variation
    if (state.mode === "variation") {
      for (let k = 0; k < state.vply; k++) { const mv = state.vpos.parsed[k]; if (mv.idx !== null && cells[mv.idx] === mv.color) label(mv.idx, String(k + 1), mv.color); }
    } else if (state.mode === "board") {
      for (let k = 0; k < state.bply; k++) { const mv = state.bpos.parsed[k]; if (mv.idx !== null && cells[mv.idx] === mv.color) label(mv.idx, String(k + 1), mv.color); }
      for (const p of state.bd.highlight || []) { const [x, y] = xy(Core.pointIdx(p)); el("rect", { x: x - 15, y: y - 15, width: 30, height: 30, rx: 3, fill: "none", stroke: "var(--accent)", "stroke-width": 3 }, gMarks); }
    } else if (state.mode === "game" && state.showNums && state.ep) {
      const [a, b] = state.ep.moves;
      for (let n = a; n <= Math.min(b, state.move); n++) { const mv = game.parsed[n - 1]; if (mv.idx !== null && cells[mv.idx] === mv.color) label(mv.idx, String(n), mv.color); }
    }
    if (state.mode === "quiz" && state.quiz) drawQuizMarks(cells);
  }
  function label(idx, text, color) {
    const [x, y] = xy(idx);
    const t = el("text", { x, y: y + 4.6, "text-anchor": "middle", "font-size": text.length > 2 ? 11.5 : 13.5, "font-weight": 500, fill: color === B ? "#F4F2EC" : "#1A1A1A", "font-family": "var(--sans)" }, gLabels);
    t.textContent = text;
  }
  // the survey's best move for move n (the position after move n is on the board), only while replaying the game
  function bestForMove() {
    if (LIVE || !D.bestMoves || !state.showBest || state.mode !== "game" || state.move < 1) return null;
    const e = D.bestMoves[state.move - 1]; if (!e || !e.best) return null;
    const played = game.parsed[state.move - 1];
    const idx = e.best === "pass" ? null : Core.pointIdx(e.best);
    return { best: e.best, idx, matched: idx === played.idx, pointsLost: e.pointsLost, played };
  }
  function ownershipKey() {
    if (LIVE || state.mode === "board") return null;
    if (state.mode === "variation") return state.vply === state.vpos.positions.length - 1 && state.br.ownershipAtEnd && D.ownership[state.br.ownershipAtEnd] ? state.br.ownershipAtEnd : null;
    const k = "m" + state.move; return D.ownership && D.ownership[k] ? k : null;
  }

  // ---------- readout / controls ----------
  const slider = $("slider"); slider.max = M; $("moveTotal").textContent = "/ " + M;
  $("scoreWho").textContent = "(points, " + youName + ")";
  function renderReadout() {
    renderBestInfo();
    $("scoreBox").hidden = LIVE || state.mode === "board";
    if (!LIVE) {
      const s = state.mode === "variation" ? (state.vply > 0 ? state.br.evals[state.vply - 1] : D.scoreSeries[state.br.fromMove]) : D.scoreSeries[state.move];
      $("scoreNow").textContent = Core.fmtScore(s);
      $("scoreNow").style.color = s > 0.05 ? "var(--gain)" : s < -0.05 ? "var(--loss)" : "inherit";
    }
    if (state.mode === "board") {
      const bd = state.bd, mv = state.bply > 0 ? state.bpos.parsed[state.bply - 1] : null, n = state.bpos.positions.length - 1;
      $("moveNum").textContent = bd.at_move;
      $("lastMove").textContent = mv ? "Move " + state.bply + " of " + n + " on this board: " + (mv.color === B ? "Black" : "White") + " " + Core.gtp(mv.idx) : boardWhere(bd).replace(/^./, (c) => c.toUpperCase());
      if (!bd.from_game) slider.value = bd.at_move;
      $("btnPrev").disabled = state.bply === 0; $("btnNext").disabled = state.bply >= n;
      $("tglOwn").disabled = true; $("tglOwn").setAttribute("aria-pressed", "false"); $("tglNums").disabled = true;
      $("tglOwn").hidden = LIVE; $("tglNums").hidden = LIVE;
      const vb = $("varbar"); vb.classList.add("on"); $("varLabel").textContent = bd.title; $("varPly").textContent = n ? "move " + state.bply + " of " + n : ""; $("varEval").textContent = "";
      return;
    }
    if (state.mode === "variation") {
      $("moveNum").textContent = state.br.fromMove;
      const mv = state.vply > 0 ? state.vpos.parsed[state.vply - 1] : null;
      $("lastMove").textContent = mv ? "Variation move " + state.vply + ": " + (mv.color === B ? "Black" : "White") + " " + Core.gtp(mv.idx) : "Variation start";
    } else {
      $("moveNum").textContent = state.move;
      const mv = state.move > 0 ? game.parsed[state.move - 1] : null;
      $("lastMove").textContent = mv ? "Last: " + (mv.color === B ? "Black" : "White") + " " + Core.gtp(mv.idx) + (mv.color === you ? " (you)" : "") : (D.game.handicap >= 2 ? "Handicap stones placed" : "Empty board");
    }
    slider.value = state.mode === "variation" ? state.br.fromMove : state.move;
    $("btnPrev").disabled = state.mode === "variation" ? state.vply === 0 : state.move === 0;
    $("btnNext").disabled = state.mode === "variation" ? state.vply >= state.vpos.positions.length - 1 : state.move >= M;
    $("tglOwn").hidden = LIVE;
    $("tglOwn").disabled = !ownershipKey(); $("tglOwn").title = ownershipKey() ? "Engine territory estimate at this position" : "No estimate stored for this position";
    $("tglOwn").setAttribute("aria-pressed", String(state.showOwn && !!ownershipKey()));
    $("tglNums").hidden = LIVE;
    $("tglNums").disabled = state.mode !== "game" || !state.ep;
    $("tglNums").setAttribute("aria-pressed", String(state.showNums));
    const vb = $("varbar");
    if (state.mode === "variation") {
      vb.classList.add("on"); $("varLabel").textContent = state.br.label; $("varPly").textContent = "move " + state.vply + " of " + (state.vpos.positions.length - 1);
      const base = D.scoreSeries[state.br.fromMove]; const d = state.vply > 0 ? state.br.evals[state.vply - 1] - base : 0;
      $("varEval").textContent = state.vply > 0 ? "change since move " + state.br.fromMove + ": " + Core.fmtScore(d) : "";
    } else vb.classList.remove("on");
  }
  function renderBestInfo() {
    const box = $("bestInfo"), tg = $("tglBest");
    tg.hidden = LIVE || !D.bestMoves; tg.disabled = state.mode !== "game"; tg.setAttribute("aria-pressed", String(state.showBest));
    const bm = bestForMove(); box.hidden = !bm; if (!bm) return;
    const who = bm.played.color === you ? "your move" : "your opponent's move";
    const lost = +bm.pointsLost;
    box.innerHTML = bm.matched ? "Best move: <b>" + esc(bm.best) + "</b>, " + who + (bm.idx !== null ? " (blue ring)." : ".")
      : "Best move: <b>" + esc(bm.best) + "</b>" + (bm.idx !== null ? " (blue)" : "") + ". " + who.replace(/^./, (c) => c.toUpperCase()) + " " + Core.gtp(bm.played.idx) + (lost >= 0.05 ? " lost " + lost.toFixed(1) + " points." : " was as good.");
  }
  function setMove(n) {
    n = Math.max(0, Math.min(M, n));
    if (state.mode === "variation") exitVariation(false);
    if (state.mode === "board") exitBoard(false);
    if (state.mode === "quiz") { state.mode = "game"; state.quiz = null; }
    state.move = n;
    const covers = (e) => n >= e.moves[0] - 1 && n <= e.moves[1];
    const covering = lessonEps.find(covers) || episodes.find(covers);
    if (covering) state.ep = covering;
    renderAll();
  }
  function step(d) {
    if (state.mode === "variation") { state.vply = Math.max(0, Math.min(state.vpos.positions.length - 1, state.vply + d)); renderAll(); return; }
    if (state.mode === "board") { state.bply = Math.max(0, Math.min(state.bpos.positions.length - 1, state.bply + d)); renderAll(); return; }
    setMove((state.mode === "quiz" ? state.quiz.at - 1 : state.move) + d);
  }
  $("btnFirst").addEventListener("click", () => setMove(0)); $("btnLast").addEventListener("click", () => setMove(M));
  $("btnPrev").addEventListener("click", () => step(-1)); $("btnNext").addEventListener("click", () => step(1));
  slider.addEventListener("input", () => setMove(parseInt(slider.value, 10)));
  $("tglOwn").addEventListener("click", () => { state.showOwn = !state.showOwn; renderAll(); });
  $("tglBest").addEventListener("click", () => { state.showBest = !state.showBest; renderAll(); });
  $("tglNums").addEventListener("click", () => { state.showNums = !state.showNums; renderAll(); });
  $("varExit").addEventListener("click", () => { if (state.mode === "board") exitBoard(true); else exitVariation(true); });
  document.addEventListener("keydown", (ev) => {
    if (ev.target && /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName) && ev.target !== slider) return;
    if (ev.key === "ArrowLeft") { step(-1); ev.preventDefault(); } else if (ev.key === "ArrowRight") { step(1); ev.preventDefault(); }
    else if (ev.key === "Home") { setMove(0); ev.preventDefault(); } else if (ev.key === "End") { setMove(M); ev.preventDefault(); }
    else if (ev.key === "Escape" && state.mode === "variation") exitVariation(true);
    else if (ev.key === "Escape" && state.mode === "board") exitBoard(true);
  });

  // ---------- strip ----------
  function renderStrip() {
    const st = $("strip"); st.innerHTML = ""; st.hidden = !episodes.length; st.classList.toggle("has-q", episodes.some(isQuestion));
    for (const e of episodes) {
      const a = (e.moves[0] - 1) / M * 100, b = Math.max((e.moves[1] - e.moves[0] + 2) / M * 100, 1.2);
      const d = document.createElement("button"); d.type = "button"; d.className = "ep" + (isQuestion(e) ? " q" : "") + (state.ep === e ? " active" : ""); d.style.left = a + "%"; d.style.width = b + "%";
      d.textContent = e.id; d.title = e.title + " (moves " + e.moves[0] + "–" + e.moves[1] + ")"; d.addEventListener("click", () => { state.ep = e; setMove(e.moves[0] - 1); });
      st.appendChild(d);
    }
    if (D.decisive && D.decisive.move) { const m = document.createElement("span"); m.className = "marker"; m.style.left = D.decisive.move / M * 100 + "%"; m.title = "Decisive move " + D.decisive.move; st.appendChild(m); }
    if (D.lastChance && D.lastChance.move) { const m = document.createElement("span"); m.className = "marker lc"; m.style.left = D.lastChance.move / M * 100 + "%"; m.title = "Last chance, move " + D.lastChance.move; st.appendChild(m); }
  }

  // ---------- graph ----------
  const G = $("graph"), GW = 600, GH = 200, GL = 34, GR = 8, GT = 10, GB = 30;
  const maxAbs = Math.max(10, ...(D.scoreSeries || []).map((v) => Math.abs(v || 0)));
  const gx = (n) => GL + n / Math.max(1, M) * (GW - GL - GR), gy = (v) => GT + (maxAbs - v) / (2 * maxAbs) * (GH - GT - GB);
  function drawGraph() {

    while (G.firstChild) G.removeChild(G.firstChild);
    const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || G).appendChild(e); return e; };
    for (const e of lessonEps) mk("rect", { x: gx(e.moves[0] - 1), y: GT, width: Math.max(2, gx(e.moves[1]) - gx(e.moves[0] - 1)), height: GH - GT - GB, fill: "var(--accent-soft)" });
    mk("line", { x1: GL, y1: gy(0), x2: GW - GR, y2: gy(0), stroke: "var(--rule)", "stroke-width": 1 });
    for (const v of [maxAbs, 0, -maxAbs]) { const t = mk("text", { x: GL - 6, y: gy(v) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)", "font-family": "var(--sans)" }); t.textContent = Core.fmtScore(v); }
    const ph = D.phases || {};
    for (const name of ["middlegame", "endgame"]) { const r = ph[name]; if (r) { mk("line", { x1: gx(r[0] - 1), y1: GT, x2: gx(r[0] - 1), y2: GH - GB, stroke: "var(--rule)", "stroke-dasharray": "3 3" }); const t = mk("text", { x: gx(r[0] - 1) + 3, y: GH - GB + 13, "font-size": 10.5, fill: "var(--muted)", "font-family": "var(--sans)" }); t.textContent = name; } }
    const t0 = mk("text", { x: gx(0), y: GH - GB + 13, "font-size": 10.5, fill: "var(--muted)", "font-family": "var(--sans)" }); t0.textContent = "opening";
    const path = D.scoreSeries.map((v, n) => (n ? "L" : "M") + gx(n).toFixed(1) + " " + gy(v || 0).toFixed(1)).join(" ");
    mk("path", { d: path, fill: "none", stroke: "var(--accent)", "stroke-width": 1.8, "stroke-linejoin": "round" });
    if (D.decisive && D.decisive.move) mk("circle", { cx: gx(D.decisive.move), cy: gy(D.scoreSeries[D.decisive.move] || 0), r: 4.5, fill: "var(--loss)" });
    if (D.lastChance && D.lastChance.move) mk("circle", { cx: gx(D.lastChance.move), cy: gy(D.scoreSeries[D.lastChance.move] || 0), r: 4.5, fill: "none", stroke: "var(--gain)", "stroke-width": 2 });
    const cur = state.mode === "variation" ? state.br.fromMove : state.mode === "quiz" ? state.quiz.at - 1 : state.move;
    mk("line", { x1: gx(cur), y1: GT, x2: gx(cur), y2: GH - GB, stroke: "var(--ink)", "stroke-width": 1.2 });
    const tm = mk("text", { x: Math.min(gx(cur) + 4, GW - 40), y: GT + 12, "font-size": 11, fill: "var(--ink)", "font-family": "var(--sans)" }); tm.textContent = "move " + cur;
    const leg = [];
    if (D.decisive && D.decisive.move) leg.push("<span>● decisive move " + D.decisive.move + (D.decisive.by === "student" ? " (yours)" : " (opponent)") + "</span>");
    if (D.lastChance && D.lastChance.move) leg.push("<span>○ last chance at move " + D.lastChance.move + ", " + esc(D.lastChance.best) + " instead of " + esc(D.lastChance.played) + "</span>");
    leg.push("<span>shaded: key moments</span>");
    $("graphLegend").innerHTML = leg.join("");
  }
  G.addEventListener("click", (ev) => {
    if (LIVE) return;
    const pt = G.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const p = pt.matrixTransform(G.getScreenCTM().inverse());
    const n = Math.round((p.x - GL) / (GW - GL - GR) * M); setMove(n);
  });

  // ---------- key-moment panel ----------
  function renderEpList() {
    const fill = (ul, list) => {
      ul.innerHTML = "";
      for (const e of list) {
        const li = document.createElement("li"); const b = document.createElement("button"); b.type = "button"; b.className = state.ep === e ? "active" : "";
        b.innerHTML = esc(e.id) + " " + esc(e.title || "") + "<span class='r'>moves " + e.moves[0] + "–" + e.moves[1] + (e.pointsLost !== null && e.pointsLost !== undefined ? ", " + (+e.pointsLost).toFixed(1) + " points" : "") + "</span>";
        b.addEventListener("click", () => { state.ep = e; setMove(e.moves[0] - 1); });
        li.appendChild(b); ul.appendChild(li);
      }
    };
    fill($("eplist"), lessonEps);
    const qs = episodes.filter(isQuestion);
    fill($("qlist"), qs);
    $("qhead").hidden = $("qlist").hidden = !qs.length;
  }
  function renderEpBody() {

  // ---------- live boards (db) ----------
  // A board is a position of the game with an optional numbered line and highlighted points that Claude

  // clicking: one move ("move") or a sequence ("line"), starting with `ask_color`, then Send.

  }

    state.bply = atEnd ? state.bpos.positions.length - 1 : Math.min(bd.line.length, state.bpos.positions.length - 1);
    renderAll();
  }
  function exitBoard(render) { const at = state.bd && !state.bd.from_game ? state.bd.at_move : state.move; state.mode = "game"; state.bd = null; state.bpos = null; state.bply = 0; state.move = at; if (render) renderAll(); }

    if (state.mode !== "board" || !state.bd) return;

    if (!atEnd && k !== state.bply) { state.bply = Math.min(k, state.bpos.positions.length - 1); renderAll(); }
  }
  function answerable(bd) { return !!bd.ask && live.canAnswer && !!live.db; }
  function addAnswerMove(idx) {
    const bd = state.bd; if (!bd || !answerable(bd) || live.sending === bd.id) return;
    const base = live.drafts.get(bd.id) || (live.answers.get(bd.id) ? live.answers.get(bd.id).moves.slice() : []);
    const moves = bd.ask === "move" ? [] : base.slice();

    const color = moves.length % 2 === 0 ? firstColor : (firstColor === B ? W : B);

    moves.push((color === B ? "B" : "W") + Core.gtp(idx));

  }
  function undoAnswer(bd) { const d = (live.drafts.get(bd.id) || (live.answers.get(bd.id) || { moves: [] }).moves).slice(); d.pop(); live.drafts.set(bd.id, d); enterBoard(bd, true); }

    live.sending = bd.id; live.msg[bd.id] = { text: "Sending…" }; renderBoards();

      live.answers.set(bd.id, { moves: moves.slice() }); live.drafts.delete(bd.id);

      b.innerHTML = esc(bd.title) + "<span class='r'>" + (bd.from_game ? "past game, move " : "after move ") + bd.at_move + (bd.ask ? (ans ? " · answered" : " · your answer") : "") + "</span>";

    const body = $("boardbody"); const bd = state.mode === "board" ? state.bd : null;
    if (!bd) { body.innerHTML = list.length ? "<p class='commentary'><span class='empty'>Pick a board to show it.</span></p>" : ""; return; }
    let html = "<h3>" + esc(bd.title) + "</h3><div class='meta'>" + esc(boardWhere(bd)) + (bd.line.length ? ", then " + bd.line.length + (bd.line.length === 1 ? " move" : " moves") + " numbered on the board" : "") + "</div>";

    if (bd.ask) {

      const who = bd.ask_color === "W" ? "White" : "Black";

        html += "<div class='moves'>" + (moves.length ? esc(fmtMoves(moves, bd.line.length)) : "<span class='empty'>No moves yet.</span>") + (ans && !draft ? " <span class='at'>(sent)</span>" : "") + "</div>";
        html += "<div class='row'>" + (bd.ask === "line" ? "<button type='button' data-a='undo'" + (moves.length ? "" : " disabled") + ">Undo</button>" : "") +

  }
  async function onBoardRows(snap) {
    const rows = [];
    for (const d of snap.docs) { const r = d.data(); if (r && r.kind === "board") rows.push(r); }
    const ok = await Promise.all(rows.map((r) => Core.rowIntact(r)));
    const fresh = new Map(), bad = new Set();
    rows.forEach((r, k) => {
      if (!ok[k] || r.game_id !== D.game.id || !(r.at_move >= 0 && (r.from_game || r.at_move <= M))) { bad.add(r.id || "?"); return; }
      try { const base = boardBase(r); Core.playLine(base, r.line || []); fresh.set(r.id, Object.assign({ line: [], highlight: [] }, r, { _base: base })); } catch (e) { bad.add(r.id || "?"); }
    });
    const newest = Array.from(fresh.values()).filter((r) => r.seq > live.seen).sort((a, b) => b.seq - a.seq)[0];
    live.boards = fresh; live.bad = bad;

    const busy = state.mode === "board" && state.bd && (live.drafts.get(state.bd.id) || []).length;
    if (newest && !busy && LIVE) { live.seen = newest.seq; enterBoard(newest, false); showBoardOnPhones(); }
    else { if (state.mode === "board" && state.bd && !fresh.has(state.bd.id)) exitBoard(false); refreshBoard(false); renderAll(); }
  }
  function onAnswerRows(snap) {

  }
  async function attach(db, user) {

    let owner = null; try { owner = user ? await user.isOwner() : null; } catch (e) { owner = null; }
    live.canAnswer = owner !== false;     // unknown: keep the controls; a refused write decides
    db.collection("boards").onSnapshot((s) => { onBoardRows(s); }, () => { live.db = null; renderAll(); });
    db.collection("answers").onSnapshot(onAnswerRows, () => {});
    renderAll();
  }

  function renderAll() { drawStones(); renderReadout(); renderStrip(); drawGraph(); renderEpList(); renderEpBody(); renderBoards(); }
  renderSummary();
  const startEp = lessonEps[0] || episodes[0];
  if (startEp) { state.ep = startEp; state.move = startEp.moves[0] - 1; }
  renderAll();
  return { attach };
}

// ---- boot: the theme, then the embedded review, or the live page's game row from the db ----------
(() => {
  const $ = (id) => document.getElementById(id);
  const themeBtn = $("themeBtn"), themes = ["auto", "light", "dark"];
  let theme = "auto"; try { theme = localStorage.getItem("goreview-theme") || "auto"; } catch (e) {}
  function applyTheme() {
    if (theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme);
    themeBtn.textContent = "Theme: " + theme;
    try { localStorage.setItem("goreview-theme", theme); } catch (e) {}
  }
  themeBtn.addEventListener("click", () => { theme = themes[(themes.indexOf(theme) + 1) % themes.length]; applyTheme(); });
  applyTheme();

  let D; try { D = JSON.parse($("data").textContent); } catch (e) { document.body.innerHTML = "<p style='padding:20px'>The review data could not be read.</p>"; return; }
  if (D.__placeholder__) { $("epbody").innerHTML = "<p class='commentary'><span class='empty'>This template has no review data yet. Build it with build_dashboard.py.</span></p>"; return; }
  const caps = (window.claude && typeof window.claude.use === "function")
    ? Promise.all([window.claude.use("db").catch(() => null), window.claude.use("user").catch(() => null)]) : Promise.resolve([null, null]);
  if (!D.__live__) { const app = App(D); caps.then(([db, user]) => app.attach(db, user)); return; }

  // live page: nothing of the engine until the dashboard; the game record arrives as a checksummed db row
  $("graphPanel").hidden = true; $("lesson").hidden = true; $("summary").hidden = true; $("live").hidden = false;
  $("liveStatus").textContent = "Connecting…";
  caps.then(([db, user]) => {
    if (!db) { $("liveStatus").textContent = "Live updates are not available in this view. Open the page on claude.ai, signed in; until then Claude shows the boards in the chat."; $("liveStatus").classList.add("warn"); return; }
    $("liveStatus").textContent = "Waiting for the game record…";
    let app = null, shown = null;
    db.doc("review/game").onSnapshot(async (snap) => {
      const row = snap.exists ? snap.data() : null;
      if (!row) return;
      if (!(await Core.rowIntact(row))) { $("liveStatus").textContent = "The game record did not arrive intact; ask Claude to send it again."; $("liveStatus").classList.add("warn"); return; }
      if (app) { if (row.sha256 !== shown) { $("liveStatus").textContent = "The game record changed: reload the page."; } return; }
      $("liveStatus").classList.remove("warn");
      shown = row.sha256; app = App(Core.fromGameRow(row)); app.attach(db, user);
    }, () => { $("liveStatus").textContent = "Lost the connection to the live data; reload the page."; });
  });
})();
</script>
